<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronóstico del tiempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero" id="hero"><div class="wrap">
  <div class="top">
    <div><h1 id="loc"></h1><p class="meta" id="meta"></p></div>
    <div class="seg" id="seg" role="group" aria-label="Cantidad de días"></div>
  </div>
  <div class="now" id="now"></div>
  <div class="chartwrap"><svg id="chart" role="group" aria-label="Temperaturas y precipitación por día"></svg></div>
  <p class="hint">Tocá un día para ver el detalle por periodo.</p>
</div></header>
<main class="wrap">
  <h2 id="dtitle"></h2>
  <section class="periods" id="detail"></section>
  <details class="ensemble">
    <summary>
      <span class="ensemble-copy">
        <strong>Pronóstico por ensamble</strong>
        <small>Medianas, rangos percentiles y probabilidades</small>
      </span>
    </summary>
    <figure class="ensemble-plot">
      <img src="data/ensemble.png" alt="Gráficos del ensamble con medianas, rangos percentiles y probabilidades para temperatura, punto de rocío, presión, nubosidad, viento y precipitación" loading="lazy">
      <figcaption><a href="data/ensemble.png" target="_blank" rel="noopener">Abrir imagen en una pestaña nueva</a></figcaption>
    </figure>
  </details>
</main>
<script src="forecast.js" defer></script>
</body>
</html>
